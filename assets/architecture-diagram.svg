<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sentinel Protocol architecture diagram</title>
<desc>Flow from sensor input through the decision-time-budget engine to a GREEN, YELLOW, or RED tiered response, with a universal safety gate governing both Earth commands and self-generated actions, and the watsonx AI reasoning layer explaining every decision.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .t { font-size: 14px; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  .th { font-size: 14px; font-weight: 600; fill: #2C2C2A; }
  .box { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 1; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .inputbox { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
  .enginebox { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
  .gatebox { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1; }
  .green { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 1; }
  .yellow { fill: #FAEEDA; stroke: #854F0B; stroke-width: 1; }
  .red { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 1; }
  .aibox { fill: #FBEAF0; stroke: #993556; stroke-width: 1; }
</style>
</defs>

<!-- Sensor inputs -->
<rect x="40" y="30" width="260" height="56" rx="8" class="inputbox"/>
<text x="170" y="52" text-anchor="middle" class="th">Sensor inputs</text>
<text x="170" y="70" text-anchor="middle" class="ts">Cliff, storm, battery, rockfall, comms</text>

<!-- Earth command input -->
<rect x="380" y="30" width="260" height="56" rx="8" class="inputbox"/>
<text x="510" y="52" text-anchor="middle" class="th">Earth command</text>
<text x="510" y="70" text-anchor="middle" class="ts">Instruction sent from mission control</text>

<line x1="170" y1="86" x2="170" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="86" x2="510" y2="130" class="arr" marker-end="url(#arrow)"/>

<!-- Decision-time-budget engine -->
<rect x="40" y="130" width="300" height="70" rx="8" class="enginebox"/>
<text x="190" y="155" text-anchor="middle" class="th">Decision-time-budget engine</text>
<text x="190" y="173" text-anchor="middle" class="ts">Time-to-harm vs. round-trip delay</text>
<text x="190" y="189" text-anchor="middle" class="ts">classify_threat()</text>

<!-- Universal safety gate -->
<rect x="380" y="130" width="260" height="70" rx="8" class="gatebox"/>
<text x="510" y="155" text-anchor="middle" class="th">Universal safety gate</text>
<text x="510" y="173" text-anchor="middle" class="ts">is_action_safe()</text>
<text x="510" y="189" text-anchor="middle" class="ts">validate_command()</text>

<line x1="190" y1="200" x2="190" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="165" x2="378" y2="165" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="200" x2="510" y2="240" class="arr" marker-end="url(#arrow)"/>

<!-- Tier outputs -->
<rect x="40" y="240" width="180" height="56" rx="8" class="green"/>
<text x="130" y="264" text-anchor="middle" class="th">GREEN</text>
<text x="130" y="282" text-anchor="middle" class="ts">Wait for Earth</text>

<rect x="250" y="240" width="180" height="56" rx="8" class="yellow"/>
<text x="340" y="264" text-anchor="middle" class="th">YELLOW</text>
<text x="340" y="282" text-anchor="middle" class="ts">Hold or reposition, notify</text>

<rect x="460" y="240" width="180" height="56" rx="8" class="red"/>
<text x="550" y="264" text-anchor="middle" class="th">RED</text>
<text x="550" y="282" text-anchor="middle" class="ts">Act now, notify after</text>

<line x1="130" y1="296" x2="130" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="296" x2="550" y2="330" class="arr" marker-end="url(#arrow)"/>

<!-- Blackout survival loop -->
<rect x="40" y="330" width="600" height="60" rx="8" class="gatebox"/>
<text x="340" y="354" text-anchor="middle" class="th">Blackout survival loop (no Earth contact)</text>
<text x="340" y="372" text-anchor="middle" class="ts">Stop if safe -&gt; else reposition (validated) -&gt; hold and monitor -&gt; relocate to power if critical</text>

<line x1="340" y1="390" x2="340" y2="420" class="arr" marker-end="url(#arrow)"/>

<!-- AI reasoning layer -->
<rect x="40" y="420" width="600" height="70" rx="8" class="aibox"/>
<text x="340" y="446" text-anchor="middle" class="th">AI reasoning layer -- IBM watsonx.ai (Granite)</text>
<text x="340" y="464" text-anchor="middle" class="ts">generate_reasoning() -- plain-language mission-log explanation</text>
<text x="340" y="480" text-anchor="middle" class="ts">for every decision, sent to Earth and shown on the dashboard</text>

<line x1="340" y1="490" x2="340" y2="530" class="arr" marker-end="url(#arrow)"/>

<!-- Dashboard -->
<rect x="140" y="530" width="400" height="60" rx="8" class="box"/>
<text x="340" y="555" text-anchor="middle" class="th">Live Streamlit dashboard</text>
<text x="340" y="573" text-anchor="middle" class="ts">Sensors, tier color, reasoning feed, decision history</text>

</svg>
